<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff6b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅行心愿单">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>旅行心愿单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;padding-bottom:90px;color:#333;-webkit-tap-highlight-color:transparent}

/* 顶部 */
.topbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#ff6b35,#f7931e);padding:10px 10px 8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.topbar h1{color:#fff;font-size:17px;margin-bottom:6px}
.tabs{display:flex;gap:0;background:rgba(255,255,255,.2);border-radius:20px;padding:3px;max-width:260px;margin:0 auto 6px}
.tab{flex:1;padding:5px 12px;font-size:13px;color:rgba(255,255,255,.7);border-radius:16px;text-align:center;cursor:pointer;border:none;background:none;font-weight:600}
.tab.on{background:#fff;color:#ff6b35}
.search input{width:100%;padding:7px 14px;font-size:14px;border-radius:16px;border:none;outline:0;background:rgba(255,255,255,.95)}

/* 输入区 */
.inputbox{background:#fff;padding:10px;position:sticky;top:96px;z-index:99;border-bottom:1px solid #eee}
.inputbox input,.inputbox textarea{width:100%;padding:8px 12px;font-size:14px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px;outline:0;font-family:inherit;-webkit-appearance:none}
.inputbox textarea{resize:vertical;min-height:32px}
.inputrow{display:flex;gap:6px;margin-bottom:6px}
.inputrow input{flex:1}
.btnadd{width:100%;padding:9px;background:#ff6b35;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;-webkit-appearance:none}
.btnphoto{background:#e8f5e9;color:#4caf50;border:1px dashed #4caf50;padding:6px 10px;border-radius:8px;font-size:12px;display:inline-block;margin-bottom:6px;cursor:pointer}
.btnphoto.has{border-style:solid;background:#c8e6c9}
#photoinput{display:none}

.hint{font-size:11px;color:#aaa;text-align:center;padding:5px 10px;background:#fafafa;border-bottom:1px solid #f0f0f0}

/* 统计 */
.stats{display:flex;justify-content:space-around;background:#fff;padding:8px;font-size:11px;color:#666;margin-bottom:8px;border-bottom:1px solid #f0f0f0}
.stats b{display:block;text-align:center;color:#ff6b35;font-size:14px;margin-bottom:1px}
.stats .sdone b{color:#4caf50}

/* 城市导航 */
.navchips{display:flex;gap:5px;padding:5px 10px;overflow-x:auto;background:#fff;margin-bottom:6px;position:sticky;top:196px;z-index:98;border-bottom:1px solid #eee}
.navchips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:2px 9px;font-size:11px;background:#f0f0f0;border-radius:10px;color:#555}
.chip.on{background:#ff6b35;color:#fff}

/* 分区标题 */
.section-title{margin:10px 10px 4px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.section-title.todo{color:#ff6b35}
.section-title.done{color:#4caf50}
.section-title .badge{background:rgba(0,0,0,.08);padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}

/* 列表 */
.prov{margin:6px 10px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.provhead{padding:9px 14px;background:#f8f9ff;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid #f0f0f0}
.provhead b{font-size:14px}
.provhead .ct{font-size:11px;color:#999;background:#eee;padding:1px 6px;border-radius:8px;margin-left:6px}
.cityblk{border-bottom:1px solid #f8f8f8}
.cityblk:last-child{border-bottom:0}
.cityname{padding:7px 14px 3px;font-size:13px;font-weight:700;color:#555;display:flex;align-items:center;gap:4px}
.cityname .d{width:5px;height:5px;border-radius:50%;background:#ff6b35;display:inline-block}
.cityname .d.done{background:#4caf50}

/* 条目 */
.item{padding:7px 14px;display:flex;align-items:flex-start;gap:6px;border-bottom:1px solid #fafafa;flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item.done .nm{text-decoration:line-through;color:#bbb}
.nm{flex:1;font-size:14px;line-height:1.4;word-break:break-all;min-width:120px}
.nm .ad{display:block;font-size:11px;color:#999;margin-top:1px}
.nm .rm{display:block;font-size:11px;color:#ff9800;margin-top:2px;line-height:1.4}
.nm .tg{display:inline-block;font-size:10px;background:#e8f5e9;color:#4caf50;padding:0 4px;border-radius:3px;margin-left:3px;vertical-align:middle}
.nm .cat{display:inline-block;font-size:10px;padding:0 4px;border-radius:3px;margin-left:3px;vertical-align:middle}
.nm .cat.food{background:#fff3e0;color:#e65100}
.nm .cat.spot{background:#e3f2fd;color:#1565c0}
.thumb{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid #eee;cursor:pointer;flex-shrink:0;margin-top:2px}

/* 按钮组 */
.btn-group{display:flex;gap:4px;align-items:center;margin-left:auto}
.btn-group button{font-size:11px;padding:4px 8px;border-radius:5px;border:none;cursor:pointer;white-space:nowrap;-webkit-appearance:none}
.btn-copy{background:#ff9800;color:#fff}
.btn-del{background:none;color:#ccc;font-size:15px;padding:2px 5px}

/* 备注输入 */
.remark-input{width:100%;padding:4px 8px;font-size:12px;border:1px solid #e0e0e0;border-radius:5px;outline:0;margin-top:3px;font-family:inherit;color:#e65100;background:#fffaf0;-webkit-appearance:none}
.remark-input::placeholder{color:#ccc;font-size:11px}

/* 照片区 */
.photobox{margin:3px 14px 6px 44px;display:flex;gap:5px;align-items:center}
.photobox img{width:54px;height:54px;object-fit:cover;border-radius:5px;border:1px solid #eee;cursor:pointer}
.photobox .ph{font-size:10px;color:#bbb}

/* 底部 */
.bottombar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.bottombar button{flex:1;padding:11px;font-size:13px;border:none;background:#fff;color:#555;border-right:1px solid #f5f5f5;-webkit-appearance:none}
.bottombar button:last-child{border-right:0}

/* 空状态 */
.empty{text-align:center;padding:24px 20px;color:#bbb;font-size:13px}
.empty .ic{font-size:28px;margin-bottom:4px}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.7);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* 大图弹窗 */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:999;justify-content:center;align-items:center}
.modal.on{display:flex}
.modal img{max-width:92vw;max-height:82vh;border-radius:8px}
.modal .x{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.3);color:#fff;border:none;border-radius:50%;width:32px;height:32px;font-size:15px}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="title">旅行心愿单</h1>
  <div class="tabs">
    <button class="tab on" id="tabFood" onclick="switchMode('food')">🍜 美食</button>
    <button class="tab" id="tabSpot" onclick="switchMode('spot')">🏞️ 景点</button>
  </div>
  <div class="search"><input id="kw" placeholder="搜索城市/店名/景点/地址/备注" oninput="onSearch()"></div>
</div>

<div class="inputbox">
  <div class="inputrow">
    <input id="ic" placeholder="城市 如:成都">
    <input id="is" placeholder="店名/景点名">
  </div>
  <textarea id="ia" placeholder="地址(选填)"></textarea>
  <input id="ir" placeholder="备注(选填) 如:一定要吃辣的、带伞..." style="width:100%;padding:8px 12px;font-size:13px;border:1px solid #ddd;border-radius:8px;margin-bottom:6px;outline:0;font-family:inherit;color:#e65100">
  <label class="btnphoto" id="bpl">+ 添加照片</label>
  <input type="file" id="photoinput" accept="image/*">
  <button class="btnadd" id="btnAdd" onclick="addItem()">添加到心愿单</button>
</div>

<div class="hint" id="hint">城市+店名必填 | 点名称标记已去 | 📋复制地址 | ✏️备注随时补</div>

<div class="stats" id="stats"></div>
<div class="navchips" id="navchips"></div>

<!-- 待去区域 -->
<div class="section-title todo" id="todoTitle">📌 待去 <span class="badge" id="todoBadge">0</span></div>
<div id="listTodo"></div>

<!-- 已去区域 -->
<div class="section-title done" id="doneTitle">✅ 已去 <span class="badge" id="doneBadge">0</span></div>
<div id="listDone"></div>

<div class="bottombar">
  <button onclick="expandAll()">展开全部</button>
  <button onclick="collapseAll()">折叠全部</button>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="closeModal()">
  <button class="x" onclick="closeModal()">X</button>
  <img id="modalimg" src="">
</div>

// ===== DOM =====
var $ic=document.getElementById("ic");
var $is=document.getElementById("is");
var $ia=document.getElementById("ia");
var $ir=document.getElementById("ir");
var $kw=document.getElementById("kw");
var $stats=document.getElementById("stats");
var $nav=document.getElementById("navchips");
var $toast=document.getElementById("toast");
var $bpl=document.getElementById("bpl");
var $pinput=document.getElementById("photoinput");
var $modal=document.getElementById("modal");
var $modalimg=document.getElementById("modalimg");
var $tabFood=document.getElementById("tabFood");
var $tabSpot=document.getElementById("tabSpot");
var $btnAdd=document.getElementById("btnAdd");
var $hint=document.getElementById("hint");
var $title=document.getElementById("title");
var $listTodo=document.getElementById("listTodo");
var $listDone=document.getElementById("listDone");
var $todoBadge=document.getElementById("todoBadge");
var $doneBadge=document.getElementById("doneBadge");

// ===== 模式 =====
var mode="food";
var cfg={
  food:{key:"fd_f",collKey:"fd_fc",lbl:"美食",ph:"店名/美食",btn:"添加到美食单",hi:"城市+店名必填 | 点名称标记已吃 | 📋复制地址 | ✏️备注随时补"},
  spot:{key:"fd_s",collKey:"fd_sc",lbl:"景点",ph:"景点名",btn:"添加到景点单",hi:"城市+景点必填 | 点名称标记已去 | 📋复制地址 | ✏️备注随时补"}
};

// ===== 数据（已清空，打开后自己记录）=====
var data=JSON.parse(localStorage.getItem(cfg[mode].key)||"[]");
var collapsed=JSON.parse(localStorage.getItem(cfg[mode].collKey)||"[]");
var kw="";
var pendPhoto=null;

// ===== 工具 =====
function save(){try{localStorage.setItem(cfg[mode].key,JSON.stringify(data))}catch(e){toast("存储已满,请删一些带照片的记录")}}
function savec(){localStorage.setItem(cfg[mode].collKey,JSON.stringify(collapsed))}
function toast(msg){$toast.textContent=msg;$toast.classList.add("on");setTimeout(function(){$toast.classList.remove("on")},1600)}

// ===== 切换模式 =====
function switchMode(m){
  if(m==mode)return;
  save();savec();
  mode=m;
  data=JSON.parse(localStorage.getItem(cfg[mode].key)||"[]");
  collapsed=JSON.parse(localStorage.getItem(cfg[mode].collKey)||"[]");
  pendPhoto=null;
  $kw.value="";kw="";
  $ic.value="";$is.value="";$ia.value="";$ir.value="";
  $bpl.className="btnphoto";$bpl.textContent="+ 添加照片";
  $tabFood.className="tab"+(mode=="food"?" on":"");
  $tabSpot.className="tab"+(mode=="spot"?" on":"");
  $btnAdd.textContent=cfg[mode].btn;
  $hint.textContent=cfg[mode].hi;
  $is.placeholder=cfg[mode].ph;
  $title.textContent=(mode=="food"?"🍜 ":"🏞️ ")+"旅行心愿单";
  render();
}

// ===== 照片 =====
$bpl.onclick=function(){$pinput.click()};
$pinput.onchange=function(){
  var f=this.files[0];if(!f)return;
  if(f.size>5*1024*1024){toast("照片太大,选5MB以下的");this.value="";return}
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement("canvas");var ctx=c.getContext("2d");
      var m=800,w=img.width,h=img.height;
      if(w>m){h=Math.round(h*(m/w));w=m}
      if(h>m){w=Math.round(w*(m/h));h=m}
      c.width=w;c.height=h;ctx.drawImage(img,0,0,w,h);
      pendPhoto=c.toDataURL("image/jpeg",0.65);
      $bpl.className="btnphoto has";$bpl.textContent="照片已选";
      toast("照片已就绪");
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(f);this.value="";
};

// ===== 复制地址(只复制地址字段) =====
function copyAddr(addr){
  if(!addr){toast("暂无地址可复制");return}
  copyText(addr);
}

function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast("✅ 已复制: "+text);
    },function(){fallbackCopy(text);});
  }else{fallbackCopy(text);}
}
function fallbackCopy(text){
  var ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("✅ 已复制: "+text);}
  catch(e){toast("复制失败,请手动复制");}
  document.body.removeChild(ta);
}

// ===== 保存备注 =====
function saveRemark(idx,val){
  data[idx].r=val;
  save();
}

// ===== 搜索 =====
function onSearch(){kw=$kw.value.trim().toLowerCase();render()}

// ===== 添加 =====
function addItem(){
  var c=$ic.value.trim(),s=$is.value.trim(),a=$ia.value.trim(),r=$ir.value.trim();
  if(!c){toast("请填城市");$ic.focus();return}
  if(!s){toast("请填"+(mode=="food"?"店名":"景点名"));$is.focus();return}
  data.push({c:c,s:s,a:a||"",r:r||"",p:pendPhoto||"",d:false,t:Date.now()});
  $ic.value="";$is.value="";$ia.value="";$ir.value="";pendPhoto=null;
  $bpl.className="btnphoto";$bpl.textContent="+ 添加照片";
  $kw.value="";kw="";save();render();toast("已添加: "+c+" "+s);
}

$ic.onkeydown=function(e){if(e.key=="Enter"){$is.focus();e.preventDefault()}};
$is.onkeydown=function(e){if(e.key=="Enter"){$ia.focus();e.preventDefault()}};
$ia.onkeydown=function(e){if(e.key=="Enter"){$ir.focus();e.preventDefault()}};
$ir.onkeydown=function(e){if(e.key=="Enter"){addItem();e.preventDefault()}};

// ===== 渲染(分待去/已去两大区) =====
function render(){
  var f=data.filter(function(i){
    if(!kw)return true;
    var r=(i.r||"").toLowerCase();
    return i.c.toLowerCase().indexOf(kw)>-1||i.s.toLowerCase().indexOf(kw)>-1||(i.a&&i.a.toLowerCase().indexOf(kw)>-1)||r.indexOf(kw)>-1;
  });

  var todo=f.filter(function(i){return !i.d});
  var doneItems=f.filter(function(i){return i.d});

  var tot=data.length;
  var dn=data.filter(function(i){return i.d}).length;
  var cc=new Set(data.map(function(i){return i.c})).size;
  var pc=new Set(data.map(function(i){return getProv(i.c)})).size;
  var phc=data.filter(function(i){return i.p}).length;
  var lbl=mode=="food"?"已吃":"已去";
  $stats.innerHTML='<span><b>'+tot+'</b>总条数</span><span class="sdone"><b>'+dn+'</b>'+lbl+'</span><span><b>'+cc+'</b>城市</span><span><b>'+pc+'</b>省份</span><span><b>'+phc+'</b>照片</span>';

  var todoCities=[...new Set(todo.map(function(i){return i.c}))].sort();
  $nav.innerHTML=todoCities.map(function(c){return '<span class="chip'+(kw==c?' on':'')+'" onclick="quickKw(\''+c+'\')">'+c+'</span>'}).join("");

  $todoBadge.textContent=todo.length;
  $doneBadge.textContent=doneItems.length;

  $listTodo.innerHTML="";
  if(todo.length==0){
    $listTodo.innerHTML='<div class="empty"><div class="ic">📭</div>'+(kw?'无匹配结果':'还没有记录,快去添加吧~')+'</div>';
  }else{
    $listTodo.appendChild(buildList(todo,false));
  }

  $listDone.innerHTML="";
  if(doneItems.length==0){
    $listDone.innerHTML='<div class="empty"><div class="ic">📭</div>还没有已去的记录,点名称标记吧~</div>';
  }else{
    $listDone.appendChild(buildList(doneItems,true));
  }
}

// 构建列表DOM
function buildList(items,isDone){
  var pm={};
  items.forEach(function(item){
    var idx=-1;
    for(var ni=0;ni<data.length;ni++){
      if(data[ni]===item){idx=ni;break;}
    }
    var p=getProv(item.c);
    if(!pm[p])pm[p]={};
    if(!pm[p][item.c])pm[p][item.c]=[];
    pm[p][item.c].push({i:item,idx:idx});
  });

  var container=document.createElement("div");
  Object.keys(pm).sort().forEach(function(p){
    var isCol=collapsed.indexOf(p)>-1;
    var pItems=0;Object.keys(pm[p]).forEach(function(c){pItems+=pm[p][c].length});

    var provDiv=document.createElement("div");provDiv.className="prov";provDiv.id="pv_"+p+(isDone?"_d":"");
    var head=document.createElement("div");head.className="provhead";
    head.innerHTML='<span><b>📍 '+p+'</b><span class="ct">'+pItems+'</span></span><span style="font-size:12px;color:#999">'+(isCol?'▶':'▼')+'</span>';
    head.onclick=function(){toggleP(p)};
    provDiv.appendChild(head);

    if(!isCol){
      Object.keys(pm[p]).sort().forEach(function(c){
        var cb=document.createElement("div");cb.className="cityblk";
        var ct=document.createElement("div");ct.className="cityname";
        ct.innerHTML='<span class="d'+(isDone?' done':'')+'"></span>'+c+' <span style="font-size:10px;color:#bbb;font-weight:normal">('+pm[p][c].length+')</span>';
        cb.appendChild(ct);

        pm[p][c].forEach(function(obj){
          var item=obj.i,idx=obj.idx;
          var row=document.createElement("div");row.className="item"+(item.d?" done":"");

          if(item.p){
            var th=document.createElement("img");th.className="thumb";th.src=item.p;
            th.onclick=function(e){e.stopPropagation();showModal(item.p)};
            row.appendChild(th);
          }

          var nm=document.createElement("div");nm.className="nm";
          var catLabel=mode=="food"?"🍜":"🏞️";
          var doneLabel=mode=="food"?"已吃":"已去";
          var remarkHtml=item.r?'<span class="rm">📝 '+item.r+'</span>':'';
          nm.innerHTML=item.s+(item.d?' <span class="tg">'+doneLabel+'</span>':'')+' <span class="cat '+(mode=="food"?"food":"spot")+'">'+catLabel+'</span>'+(item.a?'<span class="ad">📍 '+item.a+'</span>':'')+remarkHtml;
          nm.onclick=function(){data[idx].d=!data[idx].d;save();render()};
          row.appendChild(nm);

          var bg=document.createElement("div");bg.className="btn-group";

          var copyBtn=document.createElement("button");copyBtn.className="btn-copy";copyBtn.textContent="📋 复制";
          copyBtn.onclick=function(e){e.stopPropagation();copyAddr(item.a)};
          bg.appendChild(copyBtn);

          var delBtn=document.createElement("button");delBtn.className="btn-del";delBtn.textContent="🗑";
          delBtn.onclick=function(e){e.stopPropagation();data.splice(idx,1);save();render();toast("已删除")};
          bg.appendChild(delBtn);

          row.appendChild(bg);
          cb.appendChild(row);

          // 备注输入框
          var rk=document.createElement("div");rk.style.cssText="margin:2px 14px 6px 44px";
          var ri=document.createElement("input");ri.className="remark-input";ri.type="text";
          ri.placeholder=isDone?"补充备注..":"加个备注,比如口味/Tips..";
          ri.value=item.r||"";
          ri.onchange=function(e){e.stopPropagation();saveRemark(idx,this.value)};
          ri.onclick=function(e){e.stopPropagation()};
          rk.appendChild(ri);
          cb.appendChild(rk);

          if(item.p){
            var pb=document.createElement("div");pb.className="photobox";
            var pimg=document.createElement("img");pimg.src=item.p;
            pimg.onclick=function(e){e.stopPropagation();showModal(item.p)};
            pb.appendChild(pimg);
            var ht=document.createElement("span");ht.className="ph";ht.textContent="点图看大图";
            pb.appendChild(ht);
            cb.appendChild(pb);
          }
        });
        provDiv.appendChild(cb);
      });
    }
    container.appendChild(provDiv);
  });
  return container;
}

function quickKw(c){$kw.value=c;kw=c.toLowerCase();render();var p=getProv(c);var el=document.getElementById("pv_"+p);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}

function toggleP(p){
  var i=collapsed.indexOf(p);
  if(i>-1)collapsed.splice(i,1);else collapsed.push(p);
  savec();render();
}
function expandAll(){collapsed=[];savec();render();toast("已展开全部")}
function collapseAll(){collapsed=[...new Set(data.map(function(i){return getProv(i.c)}))];savec();render();toast("已折叠全部")}

// ===== 照片弹窗 =====
function showModal(src){$modalimg.src=src;$modal.classList.add("on")}
function closeModal(){$modal.classList.remove("on");$modalimg.src=""}
document.addEventListener("keydown",function(e){if(e.key=="Escape"){closeModal()}});

// ===== Service Worker 注册(PWA离线支持) =====
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}

// ===== 初始化（无示例数据，打开就是空白，等你记录）=====
render();
</script>
